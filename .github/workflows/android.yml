name: Build and sign APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install SDK
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify (v1+v2+v3)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VIVO_MOTION_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.VIVO_MOTION_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p output
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASS" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > output/signing.jks
            export KEY_PASS="$KEYSTORE_PASS"
          else
            export KEY_PASS="$(openssl rand -hex 28)"
            keytool -genkeypair -alias originmotion -keyalg RSA -keysize 3072 \
              -validity 36500 -storetype PKCS12 \
              -keystore output/signing.jks -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Origin Motion App,OU=Android,O=Independent,C=PL" -noprompt
            echo "::warning::Ephemeral signing key: upgrades require an identical signing certificate"
          fi
          "$TOOLS/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk output/aligned.apk
          "$TOOLS/apksigner" sign \
            --ks output/signing.jks --ks-key-alias originmotion \
            --ks-pass "env:KEY_PASS" --key-pass "env:KEY_PASS" \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out output/OriginOS-Animation-Tuner.apk output/aligned.apk
          "$TOOLS/apksigner" verify --min-sdk-version 21 --verbose --print-certs output/OriginOS-Animation-Tuner.apk | tee output/signatures.txt
          grep -Fq "Verified using v1 scheme (JAR signing): true" output/signatures.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" output/signatures.txt
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" output/signatures.txt
          sha256sum output/OriginOS-Animation-Tuner.apk > output/sha256.txt
          rm -f output/aligned.apk output/signing.jks
      - uses: actions/upload-artifact@v4
        with:
          name: OriginOS-Animation-Tuner-signed-v1-v2-v3
          path: |
            output/OriginOS-Animation-Tuner.apk
            output/signatures.txt
            output/sha256.txt
          if-no-files-found: error
