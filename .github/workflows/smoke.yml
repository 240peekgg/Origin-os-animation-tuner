name: Android emulator startup smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install build SDK
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)"
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug application
        run: gradle --no-daemon :app:assembleDebug
      - name: Run emulator and launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n io.peek.vivomotion/.MainActivity
            sleep 4
            adb shell dumpsys activity activities | grep -E 'mResumed|topResumedActivity' | head -10
            adb shell pidof io.peek.vivomotion
            adb shell screencap -p /sdcard/smoke.png
            adb pull /sdcard/smoke.png smoke.png
            adb logcat -d -v time > emulator-log.txt
            ! grep -A14 -E 'FATAL EXCEPTION: main|Process: io.peek.vivomotion,' emulator-log.txt | grep -q 'FATAL EXCEPTION: main'
      - name: Upload logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: |
            emulator-log.txt
            smoke.png
          if-no-files-found: ignore
